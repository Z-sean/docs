<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>练习</title>
</head>
<body>
    <!-- 图文内容卡片 -->
     <div class="picture_card">
        <figure>
            <img src="picture.jpg" 
            alt="图片内容" 
            width="30px" 
            height="40px">
            <figcaption>关于图片的介绍</figcaption>
        </figure>

     </div>


     
     
     <!-- 用户数据表 -->
      <!-- 表头必须是th,不能是td 
        th不代表一行,注意 
      -->
      <div class="container">
        <table>
            <caption>后台用户信息</caption>
            <thead>
                <tr>
                    <th>用户名</th>
                    <th>角色</th>
                    <th>状态</th>
                    <th>注册时间</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>张三</td>
                    <td>A角色</td>
                    <td>在线</td>
                    <td>2026-1-30</td>
                </tr>
            </tbody>
        </table>
      </div>


      <!-- 博客框架 -->
       <!-- aside应该在main中 -->
       <header>
       </header>
       <nav></nav>
       <main>
            <ul>
                <li>
                    <article>1</article>
                </li>
                <li>
                    <article>2</article>
                </li>
            </ul>
            <aside>广告</aside>
       </main>
       <footer></footer>
</body>
</html>
